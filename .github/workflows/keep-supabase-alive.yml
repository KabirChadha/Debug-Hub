name: Keep Supabase Alive

on:
  schedule:
    # Runs at 10:00 AM UTC every 3 days
    - cron: '0 10 */3 * *'
  workflow_dispatch: # Lets you test it manually with a button click

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Orders Table
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            "https://qbfghbdxslwcqtybumlv.supabase.co/rest/v1/orders?select=order_code&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"
